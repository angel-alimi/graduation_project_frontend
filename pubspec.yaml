name: lifeshare
description: LifeShare — a blood donation platform for Palestine.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/terms/

  fonts:
    # App text, Arabic and English.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Ooredoo is kept only for the LifeShare wordmark.
    - family: OoredooArabic
      fonts:
        - asset: assets/fonts/OoredooArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/OoredooArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/OoredooArabic-Heavy.ttf
          weight: 800
    - family: Ooredoo
      fonts:
        - asset: assets/fonts/Ooredoo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Ooredoo-Heavy.otf
          weight: 800
